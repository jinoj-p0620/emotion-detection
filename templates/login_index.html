<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore | Admin Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            display: flex;
            width: 900px;
            height: 550px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Left Side: Branding/Image */
        .login-sidebar {
            flex: 1;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .login-sidebar i {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .login-sidebar h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* Right Side: Form */
        .login-form-section {
            flex: 1.2;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #333;
            font-size: 1.8rem;
        }

        .form-header p {
            color: #777;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 38px;
            color: #aaa;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #1a73e8;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
        }

        .forgot-pass {
            color: #1a73e8;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #1557b0;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #999;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .login-sidebar { display: none; }
            .login-container { width: 90%; height: auto; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-sidebar">
            <i class="fas fa-hospital-user"></i>
            <h2>MedCore</h2>
            <p>Unified Health Management System</p>
            <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.8;">
                Authorized personnel access only.
            </p>
        </div>

        <div class="login-form-section">
            <div class="form-header">
                <h1>Admin Login</h1>
                <p>Welcome back! Please enter your credentials.</p>
            </div>

            <form action="/myapp/login_post/" method="post">
                <div class="input-group">
                    <label>Username</label>
                    <i class="fas fa-envelope"></i>
                    <input name="username" type="text" placeholder="username" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <i class="fas fa-lock"></i>
                    <input name="password" type="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">

                </div>

                <button type="submit" class="login-btn">Secure Login</button>
            </form>

            <footer>
                &copy; 2025 MedCore Health Systems. All rights reserved.
            </footer>
        </div>
    </div>

</body>
</html>
