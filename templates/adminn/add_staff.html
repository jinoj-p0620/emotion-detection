{% extends 'adminn/admin_extend.html' %}
{% block body %}

<style>
    /* Progress Stepper */
    .stepper-container {
        display: flex;
        justify-content: space-between;
        margin: 0 auto 30px;
        max-width: 600px;
        position: relative;
    }

    .stepper-container::before {
        content: '';
        position: absolute;
        top: 20px;
        left: 0;
        width: 100%;
        height: 2px;
        background: #e2e8f0;
        z-index: 1;
    }

    .step {
        width: 40px;
        height: 40px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        font-weight: bold;
        color: #94a3b8;
        transition: 0.3s;
    }

    .step.active {
        border-color: #1a73e8;
        color: #1a73e8;
        background: #e3f2fd;
    }

    .step.completed {
        background: #1a73e8;
        color: white;
        border-color: #1a73e8;
    }

    /* Form Visibility */
    .form-step {
        display: none;
        animation: fadeIn 0.4s ease-in-out;
    }

    .form-step.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Professional Card Styling */
    .form-card {
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        max-width: 800px;
        margin: 0 auto;
    }

    .section-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 25px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f4f8;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; color: #555; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }

    .form-input {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        font-size: 0.95rem;
    }

    .form-input:focus {
        outline: none;
        border-color: #1a73e8;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
    }

    /* Navigation Buttons */
    .button-group {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        gap: 15px;
    }

    .btn {
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-next { background: #1a73e8; color: white; margin-left: auto; }
    .btn-next:hover { background: #0d47a1; }
    .btn-prev { background: #f1f5f9; color: #475569; }
    .btn-prev:hover { background: #e2e8f0; }
    .btn-submit { background: #2e7d32; color: white; margin-left: auto; }
</style>

<div class="stepper-container">
    <div class="step active" id="s1">1</div>
    <div class="step" id="s2">2</div>
    <div class="step" id="s3">3</div>
</div>

<div class="form-card">
    <form id="multiStepForm" action="/myapp/add_staff_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-step active" id="step1">
            <h2 class="section-title"><i class="fas fa-user-circle"></i> Personal Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-input" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" name="qualification" class="form-input" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Profile Photo</label>
                    <input type="file" name="image" class="form-input" required>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-next" onclick="nextStep(2)">Next Details <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="form-step" id="step2">
            <h2 class="section-title"><i class="fas fa-map-marker-alt"></i> Address Details</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>City / Place</label>
                    <input type="text" name="place" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Post Office</label>
                    <input type="text" name="post" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>PIN Code</label>
                    <input type="text" name="pin" class="form-input" maxlength="6" required>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-prev" onclick="nextStep(1)"><i class="fas fa-arrow-left"></i> Previous</button>
                <button type="button" class="btn btn-next" onclick="nextStep(3)">Account Setup <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="form-step" id="step3">
            <h2 class="section-title"><i class="fas fa-lock"></i> Account Credentials</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="uname" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-input" required>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-prev" onclick="nextStep(2)"><i class="fas fa-arrow-left"></i> Previous</button>
                <button type="submit" class="btn btn-submit">Register Staff <i class="fas fa-check-circle"></i></button>
            </div>
        </div>
    </form>
</div>

<script>
    function nextStep(step) {
        // Hide all steps
        document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
        // Show target step
        document.getElementById('step' + step).classList.add('active');

        // Update Stepper Visuals
        document.querySelectorAll('.step').forEach((el, index) => {
            if (index + 1 < step) {
                el.classList.add('completed');
                el.classList.remove('active');
                el.innerHTML = '<i class="fas fa-check"></i>';
            } else if (index + 1 === step) {
                el.classList.add('active');
                el.classList.remove('completed');
                el.innerText = step;
            } else {
                el.classList.remove('active', 'completed');
                el.innerText = index + 1;
            }
        });
    }
</script>

{% endblock %}
