{% extends 'adminn/admin_extend.html' %}
{% block body %}

<style>
    /* Content Header Section */
    .content-header {
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .content-header h2 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #333;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .content-header h2 i {
        color: #1a73e8;
        background: #e3f2fd;
        padding: 10px;
        border-radius: 12px;
    }

    /* Professional Form Card */
    .form-card {
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        max-width: 900px;
        margin: 0 auto;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    .form-section-title {
        grid-column: span 2;
        font-size: 0.9rem;
        font-weight: 700;
        color: #1a73e8;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid #f0f4f8;
        padding-bottom: 10px;
        margin-bottom: 10px;
        margin-top: 10px;
    }

    .form-group {
        margin-bottom: 5px;
    }

    .form-group label {
        display: block;
        color: #555;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-control {
        width: 100%;
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 15px;
        color: #333;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        outline: none;
        border-color: #1a73e8;
        box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
    }

    /* Image Preview Section */
    .current-photo-box {
        grid-column: span 2;
        display: flex;
        align-items: center;
        gap: 20px;
        background: #f8fafc;
        padding: 15px;
        border-radius: 10px;
        border: 1px dashed #cbd5e1;
    }

    .current-photo-box img {
        width: 70px;
        height: 70px;
        border-radius: 8px;
        object-fit: cover;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Update Button */
    .update-btn {
        grid-column: span 2;
        background: #1a73e8;
        color: white;
        border: none;
        padding: 16px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.3s ease;
        margin-top: 20px;
    }

    .update-btn:hover {
        background: #0d47a1;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(26, 115, 232, 0.3);
    }

    .back-nav {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        transition: color 0.3s;
    }

    .back-nav:hover { color: #1a73e8; }

    @media (max-width: 768px) {
        .form-grid { grid-template-columns: 1fr; }
        .form-section-title, .update-btn, .current-photo-box { grid-column: span 1; }
    }
</style>

<a href="/myapp/view_staff/#about" class="back-nav">
    <i class="fas fa-arrow-left"></i> Back to Staff Directory
</a>

<div class="content-header">
    <h2><i class="fas fa-user-edit"></i> Edit Staff Profile</h2>
</div>

<div class="form-card">
    <form action="/myapp/edit_staff_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">
            
            <div class="form-section-title">Personal Details</div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ val.name }}" class="form-control" placeholder="Enter staff name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ val.email }}" class="form-control" placeholder="staff@medcore.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ val.phone }}" class="form-control" maxlength="10" required>
            </div>

            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" value="{{ val.qualification }}" class="form-control" placeholder="e.g. MBBS, MD" required>
            </div>

            <div class="form-section-title">Current Profile Photo</div>
            
            <div class="current-photo-box">
                <img src="{{ val.photo.url }}" alt="Current Photo">
                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: #475569;">Change Profile Image</label>
                    <input type="file" name="image" class="form-control" style="margin-top: 5px; padding: 5px;">
                    <p style="font-size: 0.7rem; color: #94a3b8; margin-top: 5px;">Leave empty to keep current photo.</p>
                </div>
            </div>

            <div class="form-section-title">Location & Address</div>

            <div class="form-group">
                <label>Place</label>
                <input type="text" name="place" value="{{ val.place }}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Post Office</label>
                <input type="text" name="post" value="{{ val.post }}" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Pin Code</label>
                <input type="text" name="pin" value="{{ val.pin }}" class="form-control" maxlength="6" required>
            </div>

            <button type="submit" class="update-btn">
                <i class="fas fa-save"></i> Save Changes & Update Profile
            </button>
        </div>
    </form>
</div>

{% endblock %}
